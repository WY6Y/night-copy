[package]
name = "night-copy"
version = "0.1.0"
edition = "2021"
description = "Night Copy: CW trainer game, Windows desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = "0.8"
tokio = { version = "1", features = ["net"] }
serde_json = "1"
cybercw-server = { path = "../server" }

[profile.release]
opt-level = 2
