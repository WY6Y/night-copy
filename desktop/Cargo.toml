[package]
name = "night-copy"
version = "0.2.0"
edition = "2021"
description = "Night Copy: CW trainer game, desktop and Android app"

# A library as well as the desktop binary: Android loads the app as a shared
# library.
[lib]
name = "night_copy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = "0.8"
tokio = { version = "1", features = ["net"] }
serde_json = "1"
cybercw-server = { path = "../server" }

[profile.release]
opt-level = 2
