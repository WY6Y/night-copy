<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05040d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night Copy">
<title>CyberCW: Night Copy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @font-face { font-family: "VT323"; src: url("assets/fonts/vt323.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "ShareTech"; src: url("assets/fonts/sharetechmono.woff2") format("woff2"); font-display: block; }
  :root { --bg: #05040d; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #screen { display: block; width: 100%; height: 100%; image-rendering: auto; outline: none; cursor: crosshair; }
  /* Off-screen text box: brings up the phone keyboard for word answers. */
  #type { position: fixed; left: -1000px; top: 0; width: 10px; height: 10px; opacity: 0; font-size: 16px; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #3cff9a; font: 22px ShareTech, monospace; letter-spacing: .2em; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<input id="type" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
<div id="boot">TUNING IN...</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
