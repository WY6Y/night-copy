[package]
name = "cybercw-server"
version = "0.1.0"
edition = "2021"
description = "Night Copy local backend: progress store, session log, static files"

[dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
