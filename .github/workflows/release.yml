name: Release

# Push a tag like v0.1.0 to build the Windows, macOS and Linux packages and attach
# them to a GitHub Release. Run it by hand (Actions > Release > Run workflow)
# to build without releasing; the installers are then under the run's Artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            targets: ''
            args: --bundles nsis
            out: desktop/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            name: linux
            targets: ''
            args: --bundles appimage,deb
            out: |
              desktop/target/release/bundle/appimage/*.AppImage
              desktop/target/release/bundle/deb/*.deb
          # One universal .dmg for Apple Silicon and Intel. Ad-hoc signed only
          # (no Apple Developer ID), so first launch needs Open Anyway.
          - os: macos-latest
            name: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            out: desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build installer
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: night-copy-${{ matrix.name }}
          path: ${{ matrix.out }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}

  # One APK for 64-bit and 32-bit ARM phones, signed with the release key:
  # secrets ANDROID_KEYSTORE (the .jks, base64) and ANDROID_KEYSTORE_PASSWORD.
  # Keep using the same key: Android won't update an app signed with another.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Set the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets"; exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'keyAlias=nightcopy\npassword=%s\nstoreFile=%s\n' "$PASSWORD" "$RUNNER_TEMP/release.jks" > desktop/gen/android/keystore.properties
      - name: Build APK
        working-directory: desktop
        run: |
          npm ci
          NDK_HOME="$ANDROID_NDK_LATEST_HOME" npx tauri android build --apk --target aarch64 armv7
          version=$(node -p "require('./tauri.conf.json').version")
          cp gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "Night.Copy_${version}_android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: night-copy-android
          path: desktop/Night.Copy_*_android.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/Night.Copy_*_android.apk
